[package]
name = "raspotify-docker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Configure a Spotify Connect speaker in Docker on a Raspberry Pi, with an optional Wi-Fi access point"

[[bin]]
name = "raspotify-docker"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false }

[profile.release]
opt-level = 2
