# raspotify.conf -- librespot settings, mounted in the container as /etc/raspotify/conf
# Generated by Raspotify Docker. Each LIBRESPOT_FOO_BAR variable is librespot's --foo-bar option.
# Flags are on when uncommented (an empty value), off when commented.
# A commented line falls back to librespot's default.

# Device name shown in Spotify. Default: "raspotify (<hostname>)".
#LIBRESPOT_NAME="Librespot"

# Displayed device type. Default: speaker.
#LIBRESPOT_DEVICE_TYPE=speaker

# Bitrate (kbps): 96, 160, 320. Default: 160.
#LIBRESPOT_BITRATE=160

# Audio device (see `aplay -L`). Default: the backend's default.
#LIBRESPOT_DEVICE=

# Output format: F64, F32, S32, S24, S24_3, S16. Default: S16.
#LIBRESPOT_FORMAT=S16

# Dither: none, gpdf, tpdf, tpdf_hp. Default: tpdf for S16/S24/S24_3, none otherwise.
#LIBRESPOT_DITHER=

# Mixer: softvol, alsa. Default: softvol.
#LIBRESPOT_MIXER=softvol

# ALSA mixer control, e.g. PCM or Master. Default: PCM.
#LIBRESPOT_ALSA_MIXER_CONTROL=PCM

# Initial volume in % (0-100). Default for softvol: 50.
#LIBRESPOT_INITIAL_VOLUME=50

# Volume control: cubic, fixed, linear, log. Default: log.
#LIBRESPOT_VOLUME_CTRL=log

# Volume range (dB). Default for softvol: 60.
#LIBRESPOT_VOLUME_RANGE=60

# Autoplay similar songs: on, off. Default: follow the client setting.
#LIBRESPOT_AUTOPLAY=on

# Disable gapless playback.
#LIBRESPOT_DISABLE_GAPLESS=

# Play all tracks at about the same volume (raspotify turns this on).
LIBRESPOT_ENABLE_VOLUME_NORMALISATION=

# Normalisation method: basic, dynamic. Default: dynamic.
#LIBRESPOT_NORMALISATION_METHOD=dynamic

# Normalisation gain type: track, album, auto. Default: auto.
#LIBRESPOT_NORMALISATION_GAIN_TYPE=auto

# Pregain (dB), -10.0 to 10.0. Default: 0.0.
#LIBRESPOT_NORMALISATION_PREGAIN=0

# Limiter threshold (dBFS), 0.0 to -10.0. Default: -2.0.
#LIBRESPOT_NORMALISATION_THRESHOLD=-2.0

# Limiter attack (ms), 1 to 500. Default: 5.
#LIBRESPOT_NORMALISATION_ATTACK=5

# Limiter release (ms), 1 to 1000. Default: 100.
#LIBRESPOT_NORMALISATION_RELEASE=100

# Limiter knee width (dB), 0.0 to 10.0. Default: 5.0.
#LIBRESPOT_NORMALISATION_KNEE=5.0

# Disable caching of audio data (protects the SD card).
LIBRESPOT_DISABLE_AUDIO_CACHE=

# Disable caching of credentials.
LIBRESPOT_DISABLE_CREDENTIAL_CACHE=

# Audio cache size limit (K, M, G suffixes).
#LIBRESPOT_CACHE_SIZE_LIMIT=

# Disable zeroconf discovery (then an access token is needed).
#LIBRESPOT_DISABLE_DISCOVERY=

# Spotify access token with the 'streaming' scope.
#LIBRESPOT_ACCESS_TOKEN=

# Port the zeroconf server advertises, 1-65535.
#LIBRESPOT_ZEROCONF_PORT=

# Comma-separated interface IPs zeroconf binds to. Default: all.
#LIBRESPOT_ZEROCONF_INTERFACE=

# Connect to a Spotify AP on this port (80, 443, 4070).
#LIBRESPOT_AP_PORT=

# HTTP proxy, http://ip:port.
#LIBRESPOT_PROXY=

# Program run on playback events.
#LIBRESPOT_ONEVENT=

# Only log warnings and errors.
LIBRESPOT_QUIET=

# Verbose logs.
#LIBRESPOT_VERBOSE=

# Not a librespot option: where librespot downloads tracks while playing.
# /tmp is on disk; commented out, the container keeps them in RAM (/run/raspotify).
TMPDIR=/tmp
